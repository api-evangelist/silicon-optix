name: Silicon Optix
description: Silicon Optix Inc. was a fabless semiconductor company that designed image- and video-processing
  chips, best known for its Realta HQV (Hollywood Quality Video) processor for high-definition video scaling,
  de-interlacing, and noise reduction, and for the Teranex line of professional video processors. Surfaced as
  a portfolio company of Canaan Partners, it was acquired by Integrated Device Technology (IDT) in 2008 (IDT
  was subsequently acquired by Renesas). The company operated as a hardware/chip vendor and did not publish a
  public developer API; its historical primary domain (siliconoptix.com) no longer resolves. This profile is
  retained as a network stub with no live API surface.
